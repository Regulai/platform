{% extends 'base.html' %}
{% load static %}

{% block title %}Eliminar conversación{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body text-center p-5">
        <div class="rounded-circle bg-danger-subtle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
          <iconify-icon icon="solar:trash-bin-trash-bold" class="text-danger" style="font-size: 2.5rem;"></iconify-icon>
        </div>

        <h4 class="fw-semibold mb-3">¿Eliminar la conversación?</h4>

        <p class="text-muted mb-4">
          Se eliminará <strong class="text-dark">«{{ conversation_title }}»</strong> con todos sus mensajes.
        </p>

        <div class="alert alert-warning text-start">
          <iconify-icon icon="solar:danger-triangle-bold" class="me-2"></iconify-icon>
          <strong>Atención:</strong> no se puede deshacer.
        </div>

        <div class="d-flex gap-3 justify-content-center mt-4">
          <a href="{% url 'front:chat_conversation' conversation.id %}" class="btn btn-outline-secondary px-4">
            <iconify-icon icon="solar:arrow-left-linear" class="me-1"></iconify-icon>
            Cancelar
          </a>
          <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">
              <iconify-icon icon="solar:trash-bin-trash-bold" class="me-1"></iconify-icon>
              Eliminar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
