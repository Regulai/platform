services:
  regulai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regulai-app
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - DATABASE_PATH=/app/regulai/data/db.sqlite3
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@regulai.local}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    volumes:
      - regulai-data:/app/regulai/data
      - regulai-media:/app/regulai/media
      - regulai-static:/app/regulai/staticfiles
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - regulai-network

  nginx:
    image: nginx:alpine
    container_name: regulai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - regulai-static:/app/staticfiles:ro
      - regulai-media:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - regulai
    restart: unless-stopped
    networks:
      - regulai-network

volumes:
  regulai-data:
  regulai-media:
  regulai-static:

networks:
  regulai-network:
    driver: bridge
